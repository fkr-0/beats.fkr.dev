<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09070d" />
    <meta name="description" content="Current beats, demos and experiments from Sample Lab." />
    <title>beats.fkr.dev — Sample Lab listening room</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <canvas id="visualizer" aria-hidden="true"></canvas>
    <div class="ambient ambient-a" aria-hidden="true"></div>
    <div class="ambient ambient-b" aria-hidden="true"></div>

    <header class="masthead">
      <a class="brand" href="/" aria-label="beats.fkr.dev home">
        <span class="brand-mark" aria-hidden="true">///</span>
        <span>beats.fkr.dev</span>
      </a>
      <p class="masthead-copy">sample lab / listening room</p>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">current transmission</p>
        <h1 id="hero-title">Work in motion,<br />not a discography.</h1>
        <p class="lede">
          Beats, repaints and production sketches as they leave the lab. Press play and the room reacts to the actual audio.
        </p>
        <div class="signal-line" aria-hidden="true"><span></span></div>
      </section>

      <section class="catalog-section" aria-labelledby="catalog-title">
        <div class="section-head">
          <div>
            <p class="eyebrow">catalog</p>
            <h2 id="catalog-title">Latest renders</h2>
          </div>
          <p id="track-count" class="track-count" aria-live="polite"></p>
        </div>
        <div id="catalog" class="catalog" aria-live="polite"></div>
        <p id="catalog-error" class="catalog-error" hidden></p>
      </section>
    </main>

    <aside id="player" class="player" aria-label="Audio player">
      <div class="player-now">
        <span class="player-pulse" aria-hidden="true"></span>
        <div class="player-title-wrap">
          <p id="player-status" class="player-kicker">select a render</p>
          <h2 id="player-title">Nothing playing</h2>
        </div>
      </div>

      <div class="player-transport">
        <button id="prev" class="icon-button" type="button" aria-label="Previous track">←</button>
        <button id="toggle" class="play-button" type="button" aria-label="Play" aria-pressed="false">
          <span id="toggle-icon" aria-hidden="true">▶</span>
        </button>
        <button id="next" class="icon-button" type="button" aria-label="Next track">→</button>
      </div>

      <div class="player-progress-wrap">
        <span id="elapsed" class="time">0:00</span>
        <input id="progress" class="progress" type="range" min="0" max="1000" value="0" aria-label="Seek" />
        <span id="duration" class="time">0:00</span>
      </div>

      <div class="player-side">
        <button id="info-toggle" class="text-button" type="button" aria-expanded="false" aria-controls="player-note">info</button>
        <label class="volume-wrap" aria-label="Volume">
          <span aria-hidden="true">vol</span>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.86" />
        </label>
      </div>

      <div id="player-note" class="player-note" hidden>
        <p id="player-meta" class="player-meta"></p>
        <p id="player-note-copy"></p>
      </div>
    </aside>

    <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
    <script src="assets/app.js" defer></script>
  </body>
</html>
