version: 1
name: beats.fkr.dev
description: Static audio showcase for Sample Lab beats and music experiments.
default_track: local
shell: true
sync_dir:
  - .

agent:
  notes: |
    Dependency-free static site. Keep catalog metadata intentionally small and audio files web-sized.
    Run validate before publishing. GitHub Pages deployment is handled by .github/workflows/pages.yml.
  tasks: []
  changelog:
    - Added the initial audio-reactive listening room and GitHub Pages deployment.

commands:
  validate:
    description: Validate catalog structure and referenced audio files
    category: test
    cwd: .
    run: ["python", "scripts/validate.py"]
  build:
    description: Assemble the public GitHub Pages artifact
    category: build
    cwd: .
    run: ["python", "scripts/build_site.py"]
  serve:
    description: Preview the static site locally on port 4173
    category: dev
    cwd: .
    run: ["python", "-m", "http.server", "4173", "--bind", "127.0.0.1"]
